<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140">
  <!-- Monokai background -->
  <rect width="100%" height="100%" fill="#272822"/>

  <!-- Letters: CHANU -->
  <g font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="36" fill="#F8F8F2">
    <text id="C" x="420" y="88">C</text>
    <text id="H" x="490" y="88">H</text>
    <text id="A" x="560" y="88">A</text>
    <text id="N" x="630" y="88">N</text>
    <text id="U" x="700" y="88">U</text>
  </g>

  <!-- Snake path -->
  <path id="snakePath" fill="none" stroke="transparent" d="M20 70 C 120 20, 220 120, 320 70 C 420 20, 520 120, 620 70 C 720 20, 820 120, 880 70"/>

  <!-- Snake head -->
  <g id="snake">
    <circle r="12" fill="#A6E22E" stroke="#0f0f0f" stroke-width="2"/>
  </g>

  <!-- Animate the head along the path -->
  <animateMotion xlink:href="#snake" dur="7s" repeatCount="indefinite">
    <mpath xlink:href="#snakePath"/>
  </animateMotion>

  <!-- Snake body segments -->
  <g id="body">
    <circle r="10" fill="#8FBC8F" opacity="0.9">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#snakePath"/></animateMotion>
    </circle>
    <circle r="8" fill="#66CDAA" opacity="0.8">
      <animateMotion dur="7s" begin="0.1s" repeatCount="indefinite"><mpath xlink:href="#snakePath"/></animateMotion>
    </circle>
    <circle r="7" fill="#5F9EA0" opacity="0.7">
      <animateMotion dur="7s" begin="0.2s" repeatCount="indefinite"><mpath xlink:href="#snakePath"/></animateMotion>
    </circle>
  </g>

  <!-- Letters fade when eaten -->
  <set xlink:href="#C" attributeName="opacity" to="0.2" begin="2.0s" dur="0.6s" fill="freeze"/>
  <set xlink:href="#H" attributeName="opacity" to="0.2" begin="2.6s" dur="0.6s" fill="freeze"/>
  <set xlink:href="#A" attributeName="opacity" to="0.2" begin="3.2s" dur="0.6s" fill="freeze"/>
  <set xlink:href="#N" attributeName="opacity" to="0.2" begin="3.8s" dur="0.6s" fill="freeze"/>
  <set xlink:href="#U" attributeName="opacity" to="0.2" begin="4.4s" dur="0.6s" fill="freeze"/>
</svg>
